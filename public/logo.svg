<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&amp;display=swap');

      .text-pre {
        font-family: 'Fira Code', monospace;
        fill: #1DE9B6;
        font-weight: 600;
        font-size: 72px;
      }
      .text-prompt {
        font-family: 'Fira Code', monospace;
        fill: #1A2B4C;
        font-weight: 600;
        font-size: 72px;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <g transform="translate(30, 25)">
    <path d="M 15 15 L 45 50 L 15 85"
          stroke="#1A2B4C" stroke-width="14" fill="none"
          stroke-linecap="round" stroke-linejoin="round" />

    <line x1="55" y1="85" x2="95" y2="85"
          stroke="#1A2B4C" stroke-width="14" stroke-linecap="round" />

    <path d="M 35 50 L 55 70 L 95 15"
          stroke="#1DE9B6" stroke-width="14" fill="none"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#neon-glow)" />
  </g>

  <text x="150" y="95">
    <tspan class="text-pre" filter="url(#neon-glow)">Pre</tspan>
    <tspan class="text-prompt">Prompt</tspan>
  </text>
</svg>